<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档预览</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
<style>
*{margin:0;padding:0;}
body{background:#eee;}
canvas{display:block;margin:10px auto;max-width:96%;background:#fff;}
.load{text-align:center;padding:40px;font-size:16px;}
</style>
</head>
<body oncontextmenu="return false;">
<div id="wrap"><div class="load">加载中...</div></div>

<script>
const pdfUrl = "query.pdf";
const wrap = document.getElementById("wrap");
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";

pdfjsLib.getDocument(pdfUrl).promise.then(async pdf=>{
  wrap.innerHTML = "";
  const scale = innerWidth < 700 ? 0.95 : 1.2;
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const view = page.getViewport({scale});
    const canvas = document.createElement("canvas");
    canvas.width = view.width;
    canvas.height = view.height;
    wrap.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext("2d"),viewport:view}).promise;
  }
}).catch(()=>{
  wrap.innerHTML = "<div class='load' style='color:red'>加载失败，请稍后重试</div>";
})
</script>
</body>
</html>
