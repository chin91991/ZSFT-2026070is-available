<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0"/>
<title>不动产查询证明</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f3f3f3;padding:10px 0;}
#pdfBox{width:100%;}
canvas{
    display:block;
    margin:12px auto;
    max-width:94%;
    background:#fff;
    box-shadow:0 2px 10px #ccc;
}
.load-text{
    text-align:center;
    padding:40px 20px;
    font-size:16px;
    color:#333;
}
.error-tip{
    color:red;
    text-align:center;
    padding:40px 15px;
    font-size:15px;
}
</style>
</head>
<body oncontextmenu="return false;">
<div id="pdfBox">
    <div class="load-text">文档加载中，请稍候...</div>
</div>

<script>
// 你的PDF文件名固定为 query.pdf
const pdfPath = "query.pdf";
const container = document.getElementById("pdfBox");

// 引入PDF解析工具
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";

// 渲染PDF
(async function renderPDF() {
    try {
        const pdfDoc = await pdfjsLib.getDocument(pdfPath).promise;
        container.innerHTML = "";
        // 手机适配缩放比例
        const scaleVal = window.innerWidth < 700 ? 0.93 : 1.2;

        // 循环渲染所有页面（你这份只有1页）
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: scaleVal });
            const canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            container.appendChild(canvas);
            await page.render({
                canvasContext: canvas.getContext("2d"),
                viewport: viewport
            }).promise;
        }
    } catch (err) {
        container.innerHTML = `<div class="error-tip">加载失败<br>1.确认仓库存在query.pdf<br>2.等待页面部署完成3-5分钟<br>3.强制刷新页面重试</div>`;
        console.log(err);
    }
})();
</script>
</body>
</html>
