<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不动产信息查询预览页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100vh;}
iframe{width:100%;height:100vh;border:none;}
.tip{position:absolute;bottom:10px;width:100%;text-align:center;font-size:13px;color:#666;}
.wechat-tip{
    display:none;
    background:#fff;
    padding:30px;
    text-align:center;
    font-size:16px;
}
</style>
</head>
<body oncontextmenu="return false;">
<div class="wechat-tip" id="wxTip">
    <p>请点击右上角 ··· </p>
    <p>选择【在浏览器打开】查看文档</p>
</div>
<iframe id="pdfFrame" src="./query.pdf#toolbar=0&navpanes=0&view=Fit"></iframe>
<div class="tip">仅预览文档，无下载打印功能</div>

<script>
//判断是否微信浏览器
var ua = navigator.userAgent.toLowerCase();
var isWechat = ua.match(/MicroMessenger/i)=="micromessenger";
if(isWechat){
    document.getElementById('wxTip').style.display="block";
    document.getElementById('pdfFrame').style.display="none";
}
</script>
</body>
</html>
